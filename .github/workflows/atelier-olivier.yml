name: Atelier Olivier (installateur Windows)

on:
  workflow_dispatch:
  push:
    tags: ['atelier-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atelier-olivier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir les modèles IA
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy
          python scripts/convert_models.py
      - run: npm ci
      - name: Test de bout en bout
        run: npm test
      - name: Fabriquer l'installateur
        run: node scripts/dist.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Olivier-Installation
          path: atelier-olivier/release/Atelier-Olivier-Installation.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: atelier-olivier/release/Atelier-Olivier-Installation.exe
